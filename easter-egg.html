<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#183c30">
  <title>A Little Nazar Protection | Mohit & Ashwini</title>
  <style>
    :root {
      --green: #183c30;
      --green-soft: #315746;
      --ivory: #f7f4e9;
      --gold: #b99a62;
      --ink: #293b31;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 34px 18px 42px;
      display: grid;
      place-items: center;
      color: var(--ivory);
      text-align: center;
      font-family: Georgia, 'Times New Roman', serif;
      background: radial-gradient(ellipse at top, #315746 0%, var(--green) 62%, #102b22 100%);
    }
    .page { width: min(900px, 100%); }
    .eyebrow {
      margin: 0 0 12px;
      color: #d8c49a;
      font: 600 11px/1.5 Arial, sans-serif;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--ivory);
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 400;
      line-height: 1.08;
    }
    h1 em { color: #d8c49a; font-weight: 400; }
    .intro {
      margin: 15px auto 25px;
      max-width: 540px;
      color: #e7e2d4;
      font: 14px/1.7 Arial, sans-serif;
    }
    figure {
      margin: 0 auto;
      padding: 10px;
      max-width: 820px;
      border: 1px solid rgba(185,154,98,.8);
      background: rgba(247,244,233,.08);
      box-shadow: 0 18px 55px rgba(0,0,0,.28);
    }
    figure img { display: block; width: 100%; height: auto; }
    figcaption {
      padding: 12px 8px 4px;
      color: #e4d6b6;
      font: 10px/1.5 Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .back {
      display: inline-block;
      margin-top: 27px;
      padding: 12px 21px;
      border: 1px solid var(--gold);
      color: var(--ivory);
      text-decoration: none;
      font: 600 10px/1.2 Arial, sans-serif;
      letter-spacing: .18em;
      transition: background .2s ease, color .2s ease;
    }
    .back:hover, .back:focus-visible { background: var(--ivory); color: var(--green); }
    @media (prefers-reduced-motion: reduce) { .back { transition: none; } }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">A tiny surprise from the fur family</p>
    <h1>A little <em>nazar</em> protection</h1>
    <p class="intro">You found the secret! Our Special Cutie's have taken their duties very seriously. Consider this your official dose of paw-sitive protection. 🧿</p>
    <figure>
      <img src="photos/nazar-paw-attack.png" alt="A comic illustration of an angry beagle and an orange-and-white cat teaming up against a man wearing a Nazar T-shirt; the cat is swinging a baseball bat.">
      <figcaption>Protected by the Chief Greeter &amp; the Nosy Queen</figcaption>
    </figure>
    <a class="back" href="index.html">← BACK TO THE CELEBRATION</a>
  </main>
</body>
</html>
