<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#183d2e" />
        <title>Engagement Memories | Mohit & Ashwini</title>
        <link rel="icon" href="photos/favicon.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="gallery.css" />
    </head>
    <body>
        <main>
            <div class="gallery-sparkle sparkle-one" aria-hidden="true">✧</div>
            <div class="gallery-sparkle sparkle-two" aria-hidden="true">♡</div>
            <section class="gallery-intro">
                <p class="eyebrow">A DAY FULL OF JOY</p>
                <h1>Our engagement <em>memories</em></h1>
                <p>Some little glimpses of a day we'll keep close to our hearts.</p>
                <div class="rule"><span>✧</span> &nbsp; ✦ &nbsp; <span>✧</span></div>
            </section>
            <section class="photo-grid" aria-label="Engagement photo gallery">
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/couple-01.JPG"
                    aria-label="View A favourite moment"
                >
                    <img src="photos/couple-01.JPG" alt="Mohit and Ashwini — A favourite moment" loading="lazy" /><span
                        >A favourite moment</span
                    >
                </button>
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/couple-02.jpg"
                    aria-label="View Together, always"
                >
                    <img src="photos/couple-02.jpg" alt="Mohit and Ashwini — Together, always" loading="lazy" /><span
                        >Together, always</span
                    >
                </button>
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/couple-03.jpg"
                    aria-label="View A little more us"
                >
                    <img src="photos/couple-03.jpg" alt="Mohit and Ashwini — A little more us" loading="lazy" /><span
                        >A little more us</span
                    >
                </button>
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/couple-04.JPG"
                    aria-label="View A day to remember"
                >
                    <img src="photos/couple-04.JPG" alt="Mohit and Ashwini — A day to remember" loading="lazy" /><span
                        >A day to remember</span
                    >
                </button>
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/couple-05.jpg"
                    aria-label="View The happy details"
                >
                    <img src="photos/couple-05.jpg" alt="Mohit and Ashwini — The happy details" loading="lazy" /><span
                        >The happy details</span
                    >
                </button>
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/couple-06.JPG"
                    aria-label="View Side by side"
                >
                    <img src="photos/couple-06.JPG" alt="Mohit and Ashwini — Side by side" loading="lazy" /><span
                        >Side by side</span
                    >
                </button>
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/couple-07.JPG"
                    aria-label="View Our kind of magic"
                >
                    <img src="photos/couple-07.JPG" alt="Mohit and Ashwini — Our kind of magic" loading="lazy" /><span
                        >Our kind of magic</span
                    >
                </button>
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/couple-08.jpg"
                    aria-label="View A beautiful memory"
                >
                    <img src="photos/couple-08.jpg" alt="Mohit and Ashwini — A beautiful memory" loading="lazy" /><span
                        >A beautiful memory</span
                    >
                </button>
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/couple-09.JPG"
                    aria-label="View Just the two of us"
                >
                    <img src="photos/couple-09.JPG" alt="Mohit and Ashwini — Just the two of us" loading="lazy" /><span
                        >Just the two of us</span
                    >
                </button>
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/couple-10.JPG"
                    aria-label="View The beginning of forever"
                >
                    <img
                        src="photos/couple-10.JPG"
                        alt="Mohit and Ashwini — The beginning of forever"
                        loading="lazy"
                    /><span>The beginning of forever</span>
                </button>
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/dog-portrait.JPG"
                    aria-label="View The beginning of forever"
                >
                    <img
                        src="photos/dog-portrait.JPG"
                        alt="Mohit and Ashwini — The beginning of forever"
                        loading="lazy"
                    /><span>The beginning of forever</span>
                </button>
                <button
                    class="photo-card"
                    type="button"
                    data-full="photos/cat-portrait.JPG"
                    aria-label="View The beginning of forever"
                >
                    <img
                        src="photos/cat-portrait.JPG"
                        alt="Mohit and Ashwini — The beginning of forever"
                        loading="lazy"
                    /><span>The beginning of forever</span>
                </button>
            </section>
            <nav class="gallery-bottom-nav" aria-label="Page navigation">
                <a class="gallery-nav-button" href="index.html">← HOME</a>
            </nav>
        </main>
        <footer class="landing-footer">
            <span class="made-with"
                >MADE WITH LOVE
                <a href="easter-egg.html" class="evil-eye-link" aria-label="Discover a little surprise">
                    <img src="photos/evil-eye.svg" alt="Evil eye" class="evil-eye" />
                </a>
            </span>
            <span>MOHIT &amp; ASHWINI · 27.12.2026</span>
        </footer>
        <div class="lightbox" id="lightbox" aria-hidden="true">
            <button class="close" aria-label="Close photo">×</button
            ><button class="prev" aria-label="Previous photo">‹</button
            ><img src="" alt="Expanded engagement photograph" /><button class="next" aria-label="Next photo">›</button>
            <p class="lightbox-count"></p>
        </div>
        <script src="gallery.js"></script>
    </body>
</html>
